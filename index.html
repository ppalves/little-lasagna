<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A timeline of love and laughs.">
    <title>Little Lasagna and Big Pancake</title>
    <link href="/Static/Content/BondCars/favicon.gif" type="image/gif" rel="icon">
    <link href="https://fonts.googleapis.com/css?family=Merriweather:700|Montserrat:700,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Static/Content/BondCars/bond-css/main.css">
</head>
<body class="timeline-app" data-route-mode="integrated">
    <div id="body-wrap" class="body-wrap">
        <p id="timeline-error" class="timeline-error" hidden></p>

        <section class="front-page-wrap" aria-label="Title screen">
            <div class="title-transition-stage">
                <div class="title-circle-mask">
                    <div class="custom-title-page">
                        <h1 class="custom-title-heading">
                            <span>Little Lasagna</span>
                            <span>and</span>
                            <span>Big Pancake</span>
                        </h1>
                        <div class="custom-title-visual">
                            <img class="custom-title-art"
                                 src="/Static/Content/BondCars/bond-img/little-lasagna-and-big-pancake.png"
                                 alt="Little Lasagna and Big Pancake surrounded by angels">
                            <p class="custom-title-description">a timeline of love and laughs</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <nav id="cars-nav" class="cars-nav" aria-label="Timeline pages">
            <ul></ul>
        </nav>

        <main id="cars-layer" class="scene-stage">
            <ul></ul>
        </main>

        <footer class="app-footer"></footer>
    </div>

    <script src="/Static/Content/BondCars/bond-js/timeline.js" defer></script>
</body>
</html>
