<!DOCTYPE html>
<html class="no-js">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>James Bond 007 Cars Evolution</title>
    <meta name="description" content="Explore an interactive timeline inspired by the cars of James Bond.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/Static/Content/BondCars/favicon.gif" type="image/gif" rel="icon">
    <script src="/Static/Content/BondCars/bond-js/vendor/modernizr-2.6.2.min.js"></script>
    <link href="https://fonts.googleapis.com/css?family=Merriweather:700|Montserrat:700,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Static/Content/BondCars/bond-css/normalize.css">
    <link rel="stylesheet" href="/Static/Content/BondCars/bond-css/main.css">
</head>
<body id="js-body" class="photo-test data-driven" data-route-mode="integrated">
    <div id="body-wrap" class="body-wrap">
        <p id="timeline-error" class="timeline-error" hidden></p>

        <div class="front-page-wrap" data-0="z-index:99;" data-999="z-index:99;" data-1000="z-index:-1;">
            <div class="title-transition-stage">
                <div class="title-circle-mask abs-centered"
                     data-0="width:100%;height:100%;"
                     data-300="width:100%;height:100%;"
                     data-310="width:69%;height:69%;"
                     data-1000="width:0%;height:0%;">
                    <div id="front-page" class="front-page custom-title-page">
                        <h1 class="custom-title-heading"
                            data-0="opacity:1;"
                            data-300="opacity:1;"
                            data-310="opacity:0;">
                            <span>Little Lasagna</span>
                            <span>and</span>
                            <span>Big Pancake</span>
                        </h1>
                        <div class="custom-title-visual">
                            <img class="custom-title-art"
                                 src="/Static/Content/BondCars/bond-img/little-lasagna-and-big-pancake.png"
                                 alt="Little Lasagna and Big Pancake holding hands">
                            <p class="custom-title-description"
                               data-0="opacity:1;"
                               data-300="opacity:1;"
                               data-310="opacity:0;">a timeline of love and laughs</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <nav id="cars-nav" class="cars-nav">
            <ul></ul>
        </nav>

        <main id="cars-layer" class="cars-layer">
            <ul></ul>
        </main>

        <footer id="app-footer" class="app-footer"></footer>
        <span id="scrollY"></span>
    </div>

    <script src="/Static/Content/BondCars/bond-js/vendor/jquery-1.8.2.min.js"></script>
    <script src="/Static/Content/BondCars/bond-js/vendor/skrollr.min.js"></script>
    <script src="/Static/Content/BondCars/bond-js/timeline-data.js"></script>
</body>
</html>
