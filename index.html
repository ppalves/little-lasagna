<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A timeline of love and laughs.">
    <title>Little Lasagna and Big Pancake</title>
    <link rel="icon" href="Static/Content/LittleLasagna/icons/favicon.ico" sizes="any">
    <link rel="icon" href="Static/Content/LittleLasagna/icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="Static/Content/LittleLasagna/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#FFD24D">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Lasagna &amp; Pancake">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link href="https://fonts.googleapis.com/css?family=Merriweather:400,700|Montserrat:700,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Static/Content/LittleLasagna/little-lasagna-css/main.css">
</head>
<body class="timeline-app" data-route-mode="integrated">
    <div id="body-wrap" class="body-wrap">
        <p id="timeline-error" class="timeline-error" hidden></p>

        <section class="front-page-wrap" aria-label="Title screen">
            <div class="title-transition-stage">
                <div class="title-circle-mask">
                    <div class="custom-title-page">
                        <h1 class="custom-title-heading">
                            <span>Little Lasagna</span>
                            <span>and</span>
                            <span>Big Pancake</span>
                        </h1>
                        <div class="custom-title-visual">
                            <img class="custom-title-art"
                                 src="Static/Content/LittleLasagna/little-lasagna-img/little-lasagna-and-big-pancake.png"
                                 alt="Little Lasagna and Big Pancake surrounded by angels">
                            <p class="custom-title-description">a timeline of love and laughs</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <nav id="timeline-nav" class="timeline-nav" aria-label="Timeline pages">
            <ul></ul>
        </nav>

        <main id="timeline-layer" class="scene-stage">
            <ul></ul>
        </main>

        <footer class="app-footer">
            <span class="app-footer-credit">made with ❤️ by Big Pancake</span>
        </footer>
    </div>

    <script src="Static/Content/LittleLasagna/little-lasagna-js/timeline.js" defer></script>
    <script src="Static/Content/LittleLasagna/little-lasagna-js/pwa.js" defer></script>
</body>
</html>
